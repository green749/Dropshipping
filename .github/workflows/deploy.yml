name: CI/CD Pipeline - Docker Hub & AWS EC2 Deployment

on:
  push:
    branches:
      - main

jobs:
  # =============================================================
  # Job 1: Build Docker Images and Push to Docker Hub
  # =============================================================
  build-and-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dropship-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dropship-frontend:latest

  # =============================================================
  # Job 2: Deploy Updated Images to AWS EC2
  # =============================================================
  deploy-to-aws:
    name: Deploy to AWS EC2 via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting Deployment on AWS EC2..."

            # 1. Cleanly ensure repository exists & is git-linked
            if [ ! -d "$HOME/Dropshipping/.git" ]; then
              echo "📥 Fresh cloning repository..."
              rm -rf $HOME/Dropshipping
              git clone https://github.com/green749/Dropshipping.git $HOME/Dropshipping
            fi

            cd $HOME/Dropshipping

            # 2. Fetch latest git configuration
            echo "🔄 Syncing git main branch..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Pull newly pushed Docker Hub images
            echo "📥 Pulling latest images from Docker Hub..."
            docker compose -f docker-compose.prod.yml pull || sudo docker compose -f docker-compose.prod.yml pull

            # 4. Restart containers with newly pulled images
            echo "🐳 Restarting production containers..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate || sudo docker compose -f docker-compose.prod.yml up -d --force-recreate

            # 5. Clean up unused images
            docker image prune -f || sudo docker image prune -f

            echo "✅ Deployment completed successfully!"
