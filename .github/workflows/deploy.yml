name: Deploy Dropshipping Platform to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Fullstack App to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on AWS EC2..."

            # 1. Clone or update repository
            if [ ! -d "$HOME/Dropshipping" ]; then
              git clone https://github.com/green749/Dropshipping.git $HOME/Dropshipping
            fi

            cd $HOME/Dropshipping

            # 2. Fetch latest changes from GitHub main branch
            git fetch origin main
            git reset --hard origin/main

            # 3. Build & start containers (Frontend + Backend + PostgreSQL + Redis)
            echo "🐳 Building and starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            # 4. Clean up dangling images to keep disk space free
            docker image prune -f

            echo "✅ Deployment completed successfully!"
