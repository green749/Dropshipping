name: CI/CD Pipeline - Docker Hub & AWS EC2 Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/dropship-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/dropship-frontend:latest

  deploy-to-aws:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "Starting EC2 Deployment"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed on EC2."
              exit 1
            fi

            sudo docker --version

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose is not installed."
              exit 1
            fi

            sudo docker compose version

            APP_DIR="$HOME/Dropshipping"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/green749/Dropshipping.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main

            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "docker-compose.prod.yml not found."
              exit 1
            fi

            sudo docker compose -f docker-compose.prod.yml config -q

            sudo docker compose -f docker-compose.prod.yml pull

            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate

            sudo docker ps

            sudo docker image prune -f

            echo "Deployment completed successfully"
